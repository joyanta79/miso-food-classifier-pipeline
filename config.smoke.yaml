# Smoke-test configuration overlay.
#
# Identical in structure to config.yaml but with the production data floors and
# quality gates RELAXED so a 50-image smoke dataset (25 frenchfries + 25
# hamburger) can traverse the full pipeline through to the manual-approval gate.
#
# The production config.yaml is left UNTOUCHED (min_images_per_class: 500,
# target_dataset_min: 6000, accuracy_threshold: 0.97). Use this overlay only for
# the end-to-end infrastructure smoke run, never for a real training run.
aws:
  region: us-west-2
  account_id: "363491582148"
  sagemaker_role_arn: "arn:aws:iam::363491582148:role/miso-food-clf-sagemaker-exec"
s3:
  training_bucket: "sagemaker-us-west-2-363491582148"
  model_artifacts_bucket: "sagemaker-us-west-2-363491582148"
  pipeline_artifacts_bucket: "sagemaker-us-west-2-363491582148"
  raw_archive_bucket: "sagemaker-us-west-2-363491582148"
brands:
  - id: white-castle
    naming_pattern: "wc_*"
    model_package_group: FoodClassifier-WhiteCastle
data_selection:
  recency_months: 6
  min_images_per_class: 20      # relaxed from 500
  target_dataset_min: 40        # relaxed from 6000
  target_dataset_max: 50000
embedding:
  backbone_source: imagenet
  backbone_model_path: "imagenet"
  embedding_dim: 1280
  cosine_dedup_threshold: 0.99
kfold:
  n_folds: 5
  classifier: xgboost
cleanlab:
  flag_threshold_fraction: 0.30   # relaxed from 0.05 (small set flags a larger fraction)
training:
  instance_type: ml.m5.xlarge     # CPU for smoke (production: ml.g4dn.xlarge)
  processing_instance_type: ml.m5.xlarge
  use_spot: false
  epochs: 3                       # relaxed from 50
  batch_size: 8                   # relaxed from 32 (small set)
  learning_rate: 0.001
  checkpoint_every_epochs: 5
  image_size: 224
evaluation:
  accuracy_threshold: 0.50        # relaxed from 0.97 (smoke proves the path, not accuracy)
  fp_rate_emergency_threshold: 1.0  # relaxed from 0.05
  latency_budget_ms: 60000        # relaxed from 1000 (CPU inference)
drift:
  confidence_baseline: 0.85
  level1_confidence_floor: 0.30   # relaxed from 0.65
  level2_confidence_threshold: 0.70
  correction_rate_multiplier: 3
notifications:
  review_topic_arn: "arn:aws:sns:us-west-2:363491582148:miso-review"
  ml_lead_topic_arn: "arn:aws:sns:us-west-2:363491582148:miso-ml-lead"
  vp_engineering_topic_arn: "arn:aws:sns:us-west-2:363491582148:miso-vp-eng"
local_mode:
  enabled: false
  mock_aws: false
  use_imagenet_weights: true
  seed: 2026
